<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股多维指标全景看板 - aiinvest.art</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text-main: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-primary: #0071e3;
            --apple-primary-hover: #0077ed;
            --apple-gray-border: #d2d2d7;
            --apple-radius: 14px;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1440px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 35px; padding: 0 8px; }
        h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.8px; margin: 0 0 6px 0; }
        .time-monitor { text-align: right; font-size: 13px; color: var(--apple-text-secondary); line-height: 1.6; }
        .time-live { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--apple-text-main); font-size: 14px; }
        .card { background: var(--apple-card); border-radius: var(--apple-radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02); border: 1px solid rgba(0, 0, 0, 0.01); padding: 28px; margin-bottom: 30px; }
        .control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f5f5f7; padding-bottom: 14px; }
        .control-title { font-size: 16px; font-weight: 600; }
        .year-matrix { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        .year-item { display: flex; align-items: center; gap: 8px; background: #f5f5f7; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s ease; user-select: none; }
        .year-item:hover { background: #e8e8ed; transform: translateY(-1px); }
        .year-item input { margin: 0; accent-color: var(--apple-text-main); transform: scale(1.1); }
        .btn-group { display: flex; gap: 8px; }
        button { background: #ffffff; border: 1px solid var(--apple-gray-border); color: var(--apple-text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
        button:hover { background: #f5f5f7; border-color: var(--apple-text-main); }
        button.btn-primary { background: var(--apple-primary); border-color: var(--apple-primary); color: #ffffff; }
        .table-responsive { overflow-x: auto; border-radius: var(--apple-radius); border: 1px solid #e5e5ea; background: #ffffff; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: #f5f5f7; color: var(--apple-text-main); font-weight: 600; font-size: 13px; padding: 16px; border-bottom: 1px solid #e5e5ea; white-space: nowrap; }
        td { padding: 16px; border-bottom: 1px solid #f5f5f7; font-size: 13.5px; color: #333336; white-space: nowrap; }
        .avg-row td { background-color: #f4fbfc !important; font-weight: 600; color: var(--apple-primary); }
        .counter { margin-top: 20px; font-size: 13px; color: var(--apple-text-secondary); border-top: 1px dashed #e5e5ea; padding-top: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h2>A股多维指标全景看板</h2>
                <div style="font-size: 14px; color: var(--apple-text-secondary); margin-top: 2px;">Automated Financial Quantitative Analytics Dashboard</div>
            </div>
            <div class="time-monitor">
                <div>当前系统时间：<span id="liveClock" class="time-live">00:00:00</span></div>
                <div>内核最后编译：<span id="lastModified" style="font-weight:500;">-</span></div>
            </div>
        </header>

        <div class="card">
            <div class="control-header">
                <div class="control-title">维度分析矩阵控制台</div>
                <div class="btn-group">
                    <button onclick="checkAll(true)">全选所有年份</button>
                    <button onclick="checkAll(false)">清空选择</button>
                    <button class="btn-primary" onclick="manualRefresh()">🔄 强行同步清洗数据</button>
                </div>
            </div>
            <div class="year-matrix" id="yearMatrixContainer"></div>
            <div class="counter" id="dataStatus">数据加载中...</div>
        </div>

        <div class="table-responsive">
            <table id="metricsTable">
                <thead>
                    <tr>
                        <th>股票代码</th>
                        <th>股票名称</th>
                        <th style="color:var(--apple-primary);">当前股价 (元)</th> <th>总市值 (亿)</th>
                        <th>换手率 (%)</th>
                        <th>市盈率 (PE)</th>
                        <th>市净率 (PB)</th>
                        <th>股息率 (%)</th>
                        <th>ROE (%)</th>
                        <th>ROA (%)</th>
                        <th>营收增速 (%)</th>
                        <th>净利增速 (%)</th>
                        <th>毛利率 (%)</th>
                        <th>净利率 (%)</th>
                        <th>资产负债率 (%)</th>
                        <th>流动比</th>
                        <th>速动比</th>
                        <th>每股净资产</th>
                        <th>每股现金流</th>
                        <th style="color:var(--apple-primary);">精准报告期</th> </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allFinancialData = [];
        const targetYears = ["2026", "2025", "2024", "2023", "2022", "2021", "2020", "2019", "2018", "2017", "2016"];

        function startAppleClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
            }, 1000);

            const modifyDate = new Date(document.lastModified);
            document.getElementById('lastModified').innerText = modifyDate.getFullYear() + '-' + 
                                  String(modifyDate.getMonth() + 1).padStart(2, '0') + '-' + 
                                  String(modifyDate.getDate()).padStart(2, '0') + ' ' + 
                                  modifyDate.toTimeString().split(' ')[0];
        }

        function initYearMatrix() {
            const container = document.getElementById('yearMatrixContainer');
            container.innerHTML = "";
            targetYears.forEach(year => {
                const label = document.createElement('label');
                label.className = "year-item";
                const checked = (year === "2025" || year === "2024") ? "checked" : "";
                label.innerHTML = `<input type="checkbox" value="${year}" ${checked} onchange="calculateAndRender()"> ${year}年`;
                container.appendChild(label);
            });
        }

        function checkAll(status) {
            const checkboxes = document.querySelectorAll('#yearMatrixContainer input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = status);
            calculateAndRender();
        }

        async function manualRefresh() {
            document.getElementById('dataStatus').innerText = "⏳ 正在穿透云端请求最新数据...";
            await loadData();
        }

        async function loadData() {
            try {
                const cacheBuster = 'data.json?cb=' + new Date().getTime();
                const response = await fetch(cacheBuster);
                if (!response.ok) throw new Error();
                allFinancialData = await response.json();
                document.getElementById('dataStatus').innerText = `✨ 成功载入云端真数矩阵！共捕获原始数据记录 ${allFinancialData.length} 条。`;
            } catch (error) {
                document.getElementById('dataStatus').innerText = "⚠️ 未读取到云端有效数据文件";
            }
            calculateAndRender();
        }

        function calculateAndRender() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            const selectedBoxes = document.querySelectorAll('#yearMatrixContainer input[type="checkbox"]:checked');
            const checkedYears = Array.from(selectedBoxes).map(cb => cb.value);

            if (checkedYears.length === 0) {
                tbody.innerHTML = `<tr><td colspan="20" style="text-align:center; color:#86868b; padding:50px;">💡 请在上方勾选任意年份，系统将实时响应并聚合多维均值矩阵</td></tr>`;
                return;
            }

            const filteredData = allFinancialData.filter(item => {
                if (!item.year) return false;
                return checkedYears.some(cy => String(item.year).includes(cy));
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="20" style="text-align:center; color:#86868b; padding:50px;">🔍 暂无所选年份的数据记录</td></tr>`;
                return;
            }

            // 🧠 将 price（股价）也纳入累加计算池
            const numericFields = [
                'price', 'total_mv', 'turnover_ratio', 'pe', 'pb', 'dv_ratio', 'roe', 'roa', 
                'revenue_growth', 'profit_growth', 'gross_margin', 'net_margin', 
                'debt_asset_ratio', 'current_ratio', 'quick_ratio', 'bps', 'cfps'
            ];
            
            let sums = {};
            numericFields.forEach(field => sums[field] = 0);

            filteredData.forEach(stock => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-family: monospace; font-weight:500;">${stock.ts_code || '-'}</td>
                    <td><strong>${stock.name || '-'}</strong></td> <td style="font-weight:600; color:#1d1d1f;">${formatNum(stock.price)}</td> <td>${formatNum(stock.total_mv)}</td>
                    <td>${formatNum(stock.turnover_ratio)}</td>
                    <td>${formatNum(stock.pe)}</td>
                    <td>${formatNum(stock.pb)}</td>
                    <td>${formatNum(stock.dv_ratio)}</td>
                    <td>${formatNum(stock.roe)}</td>
                    <td>${formatNum(stock.roa)}</td>
                    <td>${formatNum(stock.revenue_growth)}</td>
                    <td>${formatNum(stock.profit_growth)}</td>
                    <td>${formatNum(stock.gross_margin)}</td>
                    <td>${formatNum(stock.net_margin)}</td>
                    <td>${formatNum(stock.debt_asset_ratio)}</td>
                    <td>${formatNum(stock.current_ratio)}</td>
                    <td>${formatNum(stock.quick_ratio)}</td>
                    <td>${formatNum(stock.bps)}</td>
                    <td>${formatNum(stock.cfps)}</td>
                    <td style="color:var(--apple-text-secondary); font-weight:600;">${stock.report_type || '-'}</td> `;
                tbody.appendChild(row);

                numericFields.forEach(field => {
                    sums[field] += parseFloat(stock[field]) || 0;
                });
            });

            const totalCount = filteredData.length;
            let avgRow = document.createElement('tr');
            avgRow.className = "avg-row";
            
            avgRow.innerHTML = `
                <td>-</td>
                <td>📊 所选周期综合均值</td>
                <td>${formatNum(sums['price'] / totalCount)}</td> <td>${formatNum(sums['total_mv'] / totalCount)}</td>
                <td>${formatNum(sums['turnover_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['pe'] / totalCount)}</td>
                <td>${formatNum(sums['pb'] / totalCount)}</td>
                <td>${formatNum(sums['dv_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['roe'] / totalCount)}</td>
                <td>${formatNum(sums['roa'] / totalCount)}</td>
                <td>${formatNum(sums['revenue_growth'] / totalCount)}</td>
                <td>${formatNum(sums['profit_growth'] / totalCount)}</td>
                <td>${formatNum(sums['gross_margin'] / totalCount)}</td>
                <td>${formatNum(sums['net_margin'] / totalCount)}</td>
                <td>${formatNum(sums['debt_asset_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['current_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['quick_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['bps'] / totalCount)}</td>
                <td>${formatNum(sums['cfps'] / totalCount)}</td>
                <td style="font-size:12px; font-weight:bold;">聚合 ${totalCount} 组样本</td>
            `;
            tbody.appendChild(avgRow);

            document.getElementById('dataStatus').innerText = `✨ 聚合分析中：当前激活周期 [${checkedYears.join(', ')}] | 深度穿透全量 A股 ${totalCount} 跨年指标模型`;
        }

        function formatNum(val) {
            if (val === undefined || val === null || isNaN(val) || val === '') return '-';
            return parseFloat(val).toFixed(2);
        }

        window.onload = () => {
            startAppleClock();
            initYearMatrix();
            loadData();
        };
    </script>
</body>
</html>
