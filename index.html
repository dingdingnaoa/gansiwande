<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Quant Engine - 真实量化序列终端</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .purple-badge { background-color: #f3e8ff; color: #6b21a8; }
        .yellow-badge { background-color: #fef9c3; color: #854d0e; }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto">

    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm">
        <div>
            <h1 class="text-xl font-semibold tracking-tight">🌐 Enterprise Quant Engine</h1>
            <p class="text-xs text-gray-500 mt-1">📊 Tushare 官方原生序列 · 20年高精度月度纯真数内核</p>
        </div>
        <div class="text-right">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800 animate-pulse">
                ● 实时解密连通中
            </span>
            <p class="text-[10px] text-gray-400 mt-1" id="compile-time"></p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col justify-center">
            <label class="block text-xs font-medium text-gray-500 mb-2">📅 穿透历史时间轴切片 (支持近20年月度快速回溯)</label>
            <select id="time-select" class="block w-full rounded-xl border-gray-200 bg-gray-50 p-2.5 text-sm focus:border-blue-500 focus:ring-blue-500 outline-none transition-all">
                <option value="">正在初始化中央时间轴...</option>
            </select>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm flex flex-col justify-center">
            <label class="block text-xs font-medium text-gray-500 mb-2">🔍 全维模糊联动检索 (支持行业、股票名、代码、板块点杀)</label>
            <input type="text" id="search-input" placeholder="输入 '白酒'、'创业板'、'比亚迪' 或 '600036'..." class="block w-full rounded-xl border-gray-200 bg-gray-50 p-2.5 text-sm focus:border-blue-500 focus:ring-blue-500 outline-none transition-all">
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                        <th class="p-4">资产档案</th>
                        <th class="p-4 bg-yellow-50/50 text-yellow-900">最新价格 (元)</th>
                        <th class="p-4 bg-yellow-50/50 text-yellow-900">最新市值 (亿)</th>
                        <th class="p-4 bg-purple-50/50 text-purple-900">历史某刻股价 (元)</th>
                        <th class="p-4 bg-purple-50/50 text-purple-900">历史总市值 (亿)</th>
                        <th class="p-4">换手率</th>
                        <th class="p-4">PE (TTM)</th>
                        <th class="p-4">PB</th>
                        <th class="p-4">股息率</th>
                        <th class="p-4">ROE (%)</th>
                        <th class="p-4">毛利率 / 净利率</th>
                        <th class="p-4">营收 / 净利增速</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-100 text-sm">
                    <tr>
                        <td colspan="12" class="p-8 text-center text-gray-400">正在穿透 data.json 物理真数大仓库...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let rawData = [];
        const timeSelect = document.getElementById('time-select');
        const searchInput = document.getElementById('search-input');
        const tableBody = document.getElementById('table-body');
        const compileTimeEl = document.getElementById('compile-time');

        // 设置编译发布时间戳
        compileTimeEl.innerText = `最后编译发布时刻: ${new Date().toLocaleString()}`;

        // 异步核心加载管道
        async function initEngine() {
            try {
                // 追加物理时间戳，彻底粉碎任何 CDN 或浏览器对 JSON 数据的强缓存
                const response = await fetch(`data.json?cb=${Date.now()}`);
                if (!response.ok) throw new Error("无法读取本地数据仓库 data.json");
                rawData = await response.json();
                
                // 1. 动态抽取并清洗所有不重复的月度时间切片
                const timePeriods = [...new Set(rawData.map(item => item.report_type))];
                
                // 🧠 排序核心算法：让时间轴按照从 2026 最新到 2007 历史进行倒序排列，体验极其顺滑
                timePeriods.sort((a, b) => b.localeCompare(a, 'zh-CN'));

                timeSelect.innerHTML = '';
                timePeriods.forEach(period => {
                    const opt = document.createElement('option');
                    opt.value = period;
                    opt.innerText = period;
                    timeSelect.appendChild(opt);
                });

                // 2. 默认选中序列中的最新一个月度截面
                if (timePeriods.length > 0) {
                    timeSelect.value = timePeriods[0];
                }

                // 3. 激活监听联动
                timeSelect.addEventListener('change', renderDisplay);
                searchInput.addEventListener('input', renderDisplay);

                // 4. 首次渲染
                renderDisplay();

            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-red-500 font-medium">❌ 终端熔断崩溃原因: ${err.message}</td></tr>`;
            }
        }

        // 全自动渲染与跨行业排异引擎
        function renderDisplay() {
            const selectedTime = timeSelect.value;
            const keyword = searchInput.value.trim().toLowerCase();

            // 过滤匹配当前选定时间轴与搜索关键词的数据
            let filtered = rawData.filter(item => item.report_type === selectedTime);

            if (keyword) {
                filtered = filtered.filter(item => 
                    item.name.toLowerCase().includes(keyword) ||
                    item.ts_code.toLowerCase().includes(keyword) ||
                    item.industry.toLowerCase().includes(keyword) ||
                    item.board.toLowerCase().includes(keyword)
                );
            }

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="12" class="p-8 text-center text-gray-400">无符合当前筛选条件的真数资产记录</td></tr>`;
                return;
            }

            tableBody.innerHTML = '';
            filtered.forEach(item => {
                // 徽章美学逻辑判定
                let boardClass = "bg-gray-100 text-gray-800";
                if (item.board === "创业板") boardClass = "bg-emerald-50 text-emerald-700 border border-emerald-200";
                if (item.board === "科创板") boardClass = "bg-rose-50 text-rose-700 border border-rose-200";

                // 跨行业金融科目无损安全展示转换逻辑
                const isFinancial = (item.industry === "银行" || item.industry === "保险" || item.industry === "证券");
                const grossMarginText = isFinancial ? "-" : `${item.gross_margin.toFixed(1)}%`;
                const netMarginText = isFinancial ? "-" : `${item.net_margin.toFixed(1)}%`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition-colors";
                tr.innerHTML = `
                    <td class="p-4 font-medium">
                        <div class="text-gray-900 font-semibold">${item.name}</div>
                        <div class="text-xs text-gray-400 mt-0.5">${item.ts_code}</div>
                        <div class="flex gap-1.5 mt-1.5">
                            <span class="px-2 py-0.5 text-[10px] rounded-md font-medium bg-gray-100 text-gray-600">${item.industry}</span>
                            <span class="px-2 py-0.5 text-[10px] rounded-md font-medium ${boardClass}">${item.board}</span>
                        </div>
                    </td>
                    <td class="p-4 font-bold text-yellow-800 bg-yellow-50/20">${item.now_price.toFixed(2)}</td>
                    <td class="p-4 font-semibold text-yellow-700 bg-yellow-50/20">${item.now_mv.toFixed(1)}</td>
                    <td class="p-4 font-bold text-purple-800 bg-purple-50/20">${item.history_price.toFixed(2)}</td>
                    <td class="p-4 font-semibold text-purple-700 bg-purple-50/20">${item.total_mv.toFixed(1)}</td>
                    <td class="p-4 text-gray-600">${item.turnover_ratio.toFixed(2)}%</td>
                    <td class="p-4 text-gray-700 font-mono">${item.pe > 0 ? item.pe.toFixed(1) : '-'}</td>
                    <td class="p-4 text-gray-700 font-mono">${item.pb > 0 ? item.pb.toFixed(1) : '-'}</td>
                    <td class="p-4 text-emerald-700 font-medium">${item.dv_ratio.toFixed(2)}%</td>
                    <td class="p-4 text-gray-900 font-semibold font-mono">${item.roe.toFixed(1)}%</td>
                    <td class="p-4">
                        <div class="text-xs font-medium text-gray-500">毛利: <span class="text-gray-800 font-mono">${grossMarginText}</span></div>
                        <div class="text-xs font-medium text-gray-500 mt-0.5">净利: <span class="text-gray-800 font-mono">${netMarginText}</span></div>
                    </td>
                    <td class="p-4">
                        <div class="text-xs text-gray-500">营收: <span class="${item.revenue_growth >= 0 ? 'text-red-600' : 'text-green-600'} font-mono">${item.revenue_growth >= 0 ? '+' : ''}${item.revenue_growth.toFixed(1)}%</span></div>
                        <div class="text-xs text-gray-500 mt-0.5">净利: <span class="${item.profit_growth >= 0 ? 'text-red-600' : 'text-green-600'} font-mono">${item.profit_growth >= 0 ? '+' : ''}${item.profit_growth.toFixed(1)}%</span></div>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // 引擎点火
        initEngine();
    </script>
</body>
</html>
