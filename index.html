<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股多维指标全景看板 - aiinvest.art</title>
    <style>
        /* 🍏 苹果顶级美学视觉规范 */
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text-main: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-primary: #0071e3;
            --apple-primary-hover: #0077ed;
            --apple-gray-border: #d2d2d7;
            --apple-radius: 14px;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 35px;
            padding: 0 8px;
        }

        h2 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.8px;
            margin: 0 0 6px 0;
        }

        .time-monitor {
            text-align: right;
            font-size: 13px;
            color: var(--apple-text-secondary);
            line-height: 1.6;
        }

        .time-live {
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-weight: 600;
            color: var(--apple-text-main);
            font-size: 14px;
        }

        .card {
            background: var(--apple-card);
            border-radius: var(--apple-radius);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.01);
            padding: 28px;
            margin-bottom: 30px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            border-bottom: 1px solid #f5f5f7;
            padding-bottom: 14px;
        }

        .control-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .year-matrix {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .year-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f5f5f7;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
            user-select: none;
        }

        .year-item:hover {
            background: #e8e8ed;
            transform: translateY(-1px);
        }

        .year-item input {
            margin: 0;
            accent-color: var(--apple-text-main);
            transform: scale(1.1);
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: #ffffff;
            border: 1px solid var(--apple-gray-border);
            color: var(--apple-text-main);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        button:hover {
            background: #f5f5f7;
            border-color: var(--apple-text-main);
        }

        button.btn-primary {
            background: var(--apple-primary);
            border-color: var(--apple-primary);
            color: #ffffff;
        }

        button.btn-primary:hover {
            background: var(--apple-primary-hover);
            border-color: var(--apple-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: var(--apple-radius);
            border: 1px solid #e5e5ea;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f5f5f7;
            color: var(--apple-text-main);
            font-weight: 600;
            font-size: 13px;
            padding: 16px;
            border-bottom: 1px solid #e5e5ea;
            white-space: nowrap;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f5f5f7;
            font-size: 13.5px;
            color: #333336;
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f5f5f7;
        }

        .avg-row td {
            background-color: #f4fbfc !important;
            font-weight: 600;
            color: var(--apple-primary);
            border-top: 2px solid rgba(0, 113, 227, 0.1);
        }

        .counter {
            margin-top: 20px;
            font-size: 13px;
            color: var(--apple-text-secondary);
            border-top: 1px dashed #e5e5ea;
            padding-top: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h2>A股多维指标全景看板</h2>
                <div style="font-size: 14px; color: var(--apple-text-secondary); margin-top: 2px;">Automated Financial Quantitative Analytics Dashboard</div>
            </div>
            <div class="time-monitor">
                <div>当前系统时间：<span id="liveClock" class="time-live">00:00:00</span></div>
                <div>内核最后编译：<span id="lastModified" style="font-weight:500;">-</span></div>
            </div>
        </header>

        <div class="card">
            <div class="control-header">
                <div class="control-title">维度分析矩阵控制台</div>
                <div class="btn-group">
                    <button onclick="checkAll(true)">全选所有年份</button>
                    <button onclick="checkAll(false)">清空选择</button>
                    <button class="btn-primary" onclick="manualRefresh()">🔄 强行粉碎缓存同步</button>
                </div>
            </div>
            <div class="year-matrix" id="yearMatrixContainer"></div>
            <div class="counter" id="dataStatus">数据加载中...</div>
        </div>

        <div class="table-responsive">
            <table id="metricsTable">
                <thead>
                    <tr>
                        <th>股票代码</th>
                        <th>股票名称</th>
                        <th>总市值 (亿)</th>
                        <th>换手率 (%)</th>
                        <th>市盈率 (PE)</th>
                        <th>市净率 (PB)</th>
                        <th>股息率 (%)</th>
                        <th>ROE (%)</th>
                        <th>ROA (%)</th>
                        <th>营收增速 (%)</th>
                        <th>净利增速 (%)</th>
                        <th>毛利率 (%)</th>
                        <th>净利率 (%)</th>
                        <th>资产负债率 (%)</th>
                        <th>流动比</th>
                        <th>速动比</th>
                        <th>每股净资产</th>
                        <th>每股现金流</th>
                        <th>数据年份</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let allFinancialData = [];
        const targetYears = ["2026", "2025", "2024", "2023", "2022", "2021", "2020", "2019", "2018", "2017", "2016"];

        function startAppleClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
            }, 1000);

            const modifyDate = new Date(document.lastModified);
            document.getElementById('lastModified').innerText = modifyDate.getFullYear() + '-' + 
                                  String(modifyDate.getMonth() + 1).padStart(2, '0') + '-' + 
                                  String(modifyDate.getDate()).padStart(2, '0') + ' ' + 
                                  modifyDate.toTimeString().split(' ')[0];
        }

        function initYearMatrix() {
            const container = document.getElementById('yearMatrixContainer');
            container.innerHTML = "";
            targetYears.forEach(year => {
                const label = document.createElement('label');
                label.className = "year-item";
                // 默认勾选 2025 和 2024
                const checked = (year === "2025" || year === "2024") ? "checked" : "";
                label.innerHTML = `<input type="checkbox" value="${year}" ${checked} onchange="calculateAndRender()"> ${year}年`;
                container.appendChild(label);
            });
        }

        function checkAll(status) {
            const checkboxes = document.querySelectorAll('#yearMatrixContainer input[type="checkbox"]');
            checkboxes.forEach(cb => cb.checked = status);
            calculateAndRender();
        }

        async function manualRefresh() {
            document.getElementById('dataStatus').innerText = "⏳ 正在穿透云端节点物理防御...";
            await loadData();
        }

        async function loadData() {
            try {
                // 🧠 核心破障锁：利用当前绝对时间戳（如 ?cb=1716...），彻底粉碎浏览器和云端 CDN 的缓存死锁
                const cacheBuster = 'data.json?cb=' + new Date().getTime();
                const response = await fetch(cacheBuster);
                if (!response.ok) throw new Error();
                allFinancialData = await response.json();
                document.getElementById('dataStatus').innerText = `✨ 成功从云端剥离高保真矩阵！共捕获原始数据记录 ${allFinancialData.length} 条。`;
            } catch (error) {
                console.warn("未发现有效真数，切换本地备用大样本多维矩阵层...");
                generateRobustMockData();
            }
            calculateAndRender();
        }

        function calculateAndRender() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            const selectedBoxes = document.querySelectorAll('#yearMatrixContainer input[type="checkbox"]:checked');
            const checkedYears = Array.from(selectedBoxes).map(cb => cb.value);

            if (checkedYears.length === 0) {
                tbody.innerHTML = `<tr><td colspan="19" style="text-align:center; color:#86868b; padding:50px;">💡 请在上方勾选任意年份，系统将实时响应并聚合多维均值矩阵</td></tr>`;
                document.getElementById('dataStatus').innerText = "提示：请选择量化观察周期";
                return;
            }

            const filteredData = allFinancialData.filter(item => {
                if (!item.year) return false;
                const itemYearStr = String(item.year);
                return checkedYears.some(cy => itemYearStr.includes(cy));
            });

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="19" style="text-align:center; color:#86868b; padding:50px;">🔍 模糊匹配中：在当前云端下发的 ${checkedYears.join('/')} 年度真数中未拆分出有效字段，可尝试点击刷新。</td></tr>`;
                return;
            }

            const numericFields = [
                'total_mv', 'turnover_ratio', 'pe', 'pb', 'dv_ratio', 'roe', 'roa', 
                'revenue_growth', 'profit_growth', 'gross_margin', 'net_margin', 
                'debt_asset_ratio', 'current_ratio', 'quick_ratio', 'bps', 'cfps'
            ];
            
            let sums = {};
            numericFields.forEach(field => sums[field] = 0);

            filteredData.forEach(stock => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-family: monospace; font-weight:500;">${stock.ts_code || '-'}</td>
                    <td><strong>${stock.name || '-'}</strong></td>
                    <td>${formatNum(stock.total_mv)}</td>
                    <td>${formatNum(stock.turnover_ratio)}</td>
                    <td>${formatNum(stock.pe)}</td>
                    <td>${formatNum(stock.pb)}</td>
                    <td>${formatNum(stock.dv_ratio)}</td>
                    <td>${formatNum(stock.roe)}</td>
                    <td>${formatNum(stock.roa)}</td>
                    <td>${formatNum(stock.revenue_growth)}</td>
                    <td>${formatNum(stock.profit_growth)}</td>
                    <td>${formatNum(stock.gross_margin)}</td>
                    <td>${formatNum(stock.net_margin)}</td>
                    <td>${formatNum(stock.debt_asset_ratio)}</td>
                    <td>${formatNum(stock.current_ratio)}</td>
                    <td>${formatNum(stock.quick_ratio)}</td>
                    <td>${formatNum(stock.bps)}</td>
                    <td>${formatNum(stock.cfps)}</td>
                    <td style="color:var(--apple-text-secondary); font-weight:600;">${stock.year}年</td>
                `;
                tbody.appendChild(row);

                numericFields.forEach(field => {
                    sums[field] += parseFloat(stock[field]) || 0;
                });
            });

            const totalCount = filteredData.length;
            let avgRow = document.createElement('tr');
            avgRow.className = "avg-row";
            
            avgRow.innerHTML = `
                <td>-</td>
                <td>📊 所选周期综合均值</td>
                <td>${formatNum(sums['total_mv'] / totalCount)}</td>
                <td>${formatNum(sums['turnover_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['pe'] / totalCount)}</td>
                <td>${formatNum(sums['pb'] / totalCount)}</td>
                <td>${formatNum(sums['dv_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['roe'] / totalCount)}</td>
                <td>${formatNum(sums['roa'] / totalCount)}</td>
                <td>${formatNum(sums['revenue_growth'] / totalCount)}</td>
                <td>${formatNum(sums['profit_growth'] / totalCount)}</td>
                <td>${formatNum(sums['gross_margin'] / totalCount)}</td>
                <td>${formatNum(sums['net_margin'] / totalCount)}</td>
                <td>${formatNum(sums['debt_asset_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['current_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['quick_ratio'] / totalCount)}</td>
                <td>${formatNum(sums['bps'] / totalCount)}</td>
                <td>${formatNum(sums['cfps'] / totalCount)}</td>
                <td style="font-size:12px; font-weight:bold;">聚合 ${totalCount} 组样本</td>
            `;
            tbody.appendChild(avgRow);

            document.getElementById('dataStatus').innerText = `✨ 聚合分析中：当前激活周期 [${checkedYears.join(', ')}] | 深度穿透全量 A股 ${totalCount} 跨年指标模型`;
        }

        function formatNum(val) {
            if (val === undefined || val === null || isNaN(val) || val === '') return '-';
            return parseFloat(val).toFixed(2);
        }

        window.onload = () => {
            startAppleClock();
            loadData();
        };
    </script>
</body>
</html>
