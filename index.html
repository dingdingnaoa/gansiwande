<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股多维指标全景看板 - aiinvest.art</title>
    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-card: #ffffff;
            --apple-text-main: #1d1d1f;
            --apple-text-secondary: #86868b;
            --apple-primary: #0071e3;
            --apple-primary-hover: #0077ed;
            --apple-gray-border: #d2d2d7;
            --apple-radius: 14px;
        }

        body {
            background-color: var(--apple-bg);
            color: var(--apple-text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1440px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 35px; padding: 0 8px; }
        h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.8px; margin: 0 0 6px 0; }
        .time-monitor { text-align: right; font-size: 13px; color: var(--apple-text-secondary); line-height: 1.6; }
        .time-live { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; color: var(--apple-text-main); font-size: 14px; }
        .card { background: var(--apple-card); border-radius: var(--apple-radius); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02); border: 1px solid rgba(0, 0, 0, 0.01); padding: 28px; margin-bottom: 30px; }
        .control-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f5f5f7; padding-bottom: 14px; }
        .control-title { font-size: 16px; font-weight: 600; }
        
        .selector-row { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 16px; align-items: center; }
        .selector-item { display: flex; align-items: center; gap: 10px; }
        label { font-size: 14px; font-weight: 600; color: var(--apple-text-main); }
        select, .apple-input {
            padding: 10px 16px;
            font-size: 13.5px;
            border-radius: 8px;
            border: 1px solid var(--apple-gray-border);
            background: #f5f5f7;
            color: var(--apple-text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        select:focus, .apple-input:focus {
            background: #ffffff;
            border-color: var(--apple-primary);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.15);
        }

        .btn-group { display: flex; gap: 8px; }
        button { background: #ffffff; border: 1px solid var(--apple-gray-border); color: var(--apple-text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
        button:hover { background: #f5f5f7; border-color: var(--apple-text-main); }
        button.btn-primary { background: var(--apple-primary); border-color: var(--apple-primary); color: #ffffff; }
        .table-responsive { overflow-x: auto; border-radius: var(--apple-radius); border: 1px solid #e5e5ea; background: #ffffff; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        th {
            background-color: #f5f5f7;
            color: var(--apple-text-main);
            font-weight: 600;
            font-size: 13px;
            padding: 16px;
            border-bottom: 1px solid #e5e5ea;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s ease;
        }
        th:hover { background-color: #e8e8ed; }
        th::after { content: " ⇅"; opacity: 0.3; font-size: 11px; }

        td { padding: 16px; border-bottom: 1px solid #f5f5f7; font-size: 13.5px; color: #333336; white-space: nowrap; }
        tr:hover td { background-color: #f5f5f7; }
        
        .avg-row td { background-color: #f4fbfc !important; font-weight: 600; color: var(--apple-primary); border-top: 2px solid rgba(0, 113, 227, 0.1); }
        .counter { margin-top: 20px; font-size: 13px; color: var(--apple-text-secondary); border-top: 1px dashed #e5e5ea; padding-top: 14px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
        .badge-main { background: #e1f5fe; color: #0288d1; }
        .badge-cy { background: #e8f5e9; color: #388e3c; }
        .badge-kc { background: #fff3e0; color: #f57c00; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h2>A股多维指标全景看板</h2>
                <div style="font-size: 14px; color: var(--apple-text-secondary); margin-top: 2px;">Automated Financial Quantitative Analytics Dashboard</div>
            </div>
            <div class="time-monitor">
                <div>当前系统时间：<span id="liveClock" class="time-live">00:00:00</span></div>
                <div>内核最后编译：<span id="lastModified" style="font-weight:500;">-</span></div>
            </div>
        </header>

        <div class="card">
            <div class="control-header">
                <div class="control-title">高阶量化交易终端</div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="manualRefresh()">🔄 强行同步清洗数据</button>
                </div>
            </div>
            
            <div class="selector-row">
                <div class="selector-item">
                    <label for="yearSelect">观测基准时刻:</label>
                    <select id="yearSelect" onchange="calculateAndRender()">
                        <option value="2025" selected>2025年度</option>
                        <option value="2026">2026年度 (至今)</option>
                        <option value="2024">2024年度</option>
                        <option value="2023">2023年度</option>
                        <option value="2022">2022年度</option>
                        <option value="2021">2021年度</option>
                        <option value="2020">2020年度</option>
                        <option value="2019">2019年度</option>
                        <option value="2018">2018年度</option>
                        <option value="2017">2017年度</option>
                        <option value="2016">2016年度</option>
                    </select>
                </div>

                <div class="selector-item">
                    <label for="stockSearchInput">列表实时筛选:</label>
                    <input type="text" id="stockSearchInput" class="apple-input" style="width:280px;" placeholder="输入代码 / 名称 / 行业 / 板块..." oninput="calculateAndRender()">
                </div>
            </div>

            <div class="counter" id="dataStatus">数据加载中...</div>
        </div>

        <div class="table-responsive">
            <table id="metricsTable">
                <thead>
                    <tr>
                        <th onclick="sortTable('report_type')">精准报告期</th>
                        <th onclick="sortTable('ts_code')">股票代码</th>
                        <th onclick="sortTable('name')">股票名称</th>
                        <th onclick="sortTable('industry')">所属行业</th>
                        <th onclick="sortTable('board')">分类板块</th>
                        <th onclick="sortTable('history_price')" style="color:var(--apple-primary);">所选时刻股价(元)</th>
                        <th onclick="sortTable('now_price')" style="color:#e65100;">当前最新股价(元)</th>
                        <th onclick="sortTable('total_mv')">总市值(亿)</th>
                        <th onclick="sortTable('turnover_ratio')">换手率(%)</th>
                        <th onclick="sortTable('pe')">市盈率(PE)</th>
                        <th onclick="sortTable('pb')">市净率(PB)</th>
                        <th onclick="sortTable('dv_ratio')">股息率(%)</th>
                        <th onclick="sortTable('roe')">ROE(%)</th>
                        <th onclick="sortTable('roa')">ROA(%)</th>
                        <th onclick="sortTable('revenue_growth')">营收增速(%)</th>
                        <th onclick="sortTable('profit_growth')">净利增速(%)</th>
                        <th onclick="sortTable('gross_margin')">毛利率(%)</th>
                        <th onclick="sortTable('net_margin')">净利率(%)</th>
                        <th onclick="sortTable('debt_asset_ratio')">资产负债率(%)</th>
                        <th onclick="sortTable('current_ratio')">流动比</th>
                        <th onclick="sortTable('quick_ratio')">速动比</th>
                        <th onclick="sortTable('bps')">每股净资产</th>
                        <th onclick="sortTable('cfps')">每股现金流</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script {nonce}>
        let allFinancialData = [];
        let currentSortField = '';
        let currentSortOrder = 'asc';

        function startAppleClock() {
            setInterval(() => {
                document.getElementById('liveClock').innerText = new Date().toTimeString().split(' ')[0];
            }, 1000);
            const modifyDate = new Date(document.lastModified);
            document.getElementById('lastModified').innerText = modifyDate.getFullYear() + '-' + 
                                  String(modifyDate.getMonth() + 1).padStart(2, '0') + '-' + 
                                  String(modifyDate.getDate()).padStart(2, '0') + ' ' + 
                                  modifyDate.toTimeString().split(' ')[0];
        }

        async function manualRefresh() {
            document.getElementById('dataStatus').innerText = "⏳ 正在穿透云端请求最新数据...";
            await loadData();
        }

        async function loadData() {
            try {
                const response = await fetch('data.json?cb=' + new Date().getTime());
                if (!response.ok) throw new Error();
                allFinancialData = await response.json();
                document.getElementById('dataStatus').innerText = `✨ 成功载入云端真数矩阵！共捕获原始历史大样本记录 ${allFinancialData.length} 条。`;
            } catch (error) {
                document.getElementById('dataStatus').innerText = "⚠️ 未读取到云端有效数据文件";
            }
            calculateAndRender();
        }

        function sortTable(field) {
            if (currentSortField === field) {
                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortField = field;
                currentSortOrder = 'desc'; 
            }
            calculateAndRender();
        }

        function calculateAndRender() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";

            const selectedYear = parseInt(document.getElementById('yearSelect').value);
            const searchKeyword = document.getElementById('stockSearchInput').value.trim().toLowerCase();

            // 🧠 严格只锁定当前选择年份的截面真数
            let baseData = allFinancialData.filter(item => intVal(item.year) === selectedYear);

            if (searchKeyword) {
                baseData = baseData.filter(item => {
                    return (item.ts_code || '').toLowerCase().includes(searchKeyword) ||
                           (item.name || '').toLowerCase().includes(searchKeyword) ||
                           (item.industry || '').toLowerCase().includes(searchKeyword) ||
                           (item.board || '').toLowerCase().includes(searchKeyword);
                });
            }

            if (baseData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="23" style="text-align:center; color:#86868b; padding:50px;">🔍 暂无符合当前年份和筛选条件的股票记录</td></tr>`;
                return;
            }

            if (currentSortField) {
                baseData.sort((a, b) => {
                    let valA = a[currentSortField];
                    let valB = b[currentSortField];
                    if (!isNaN(valA) && !isNaN(valB)) {
                        return currentSortOrder === 'asc' ? valA - valB : valB - valA;
                    }
                    return currentSortOrder === 'asc' ? 
                        String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                });
            }

            const numericFields = [
                'history_price', 'now_price', 'total_mv', 'turnover_ratio', 'pe', 'pb', 'dv_ratio', 'roe', 'roa', 
                'revenue_growth', 'profit_growth', 'gross_margin', 'net_margin', 
                'debt_asset_ratio', 'current_ratio', 'quick_ratio', 'bps', 'cfps'
            ];
            
            let baseSums = {};
            numericFields.forEach(f => baseSums[f] = 0);

            baseData.forEach(stock => {
                let row = document.createElement('tr');
                let boardBadge = `<span class="badge badge-main">主板</span>`;
                if (stock.board === "创业板") boardBadge = `<span class="badge badge-cy">创业板</span>`;
                if (stock.board === "科创板") boardBadge = `<span class="badge badge-kc">科创板</span>`;

                row.innerHTML = `
                    <td style="color:#0071e3; font-weight:600; background:#fbfdff;">${stock.report_type || '-'}</td>
                    <td style="font-family: monospace;">${stock.ts_code || '-'}</td>
                    <td><strong>${stock.name || '-'}</strong></td>
                    <td style="color:#555;">${stock.industry || '-'}</td>
                    <td>${boardBadge}</td>
                    <td style="font-weight:600;">${formatNum(stock.history_price)}</td>
                    <td style="font-weight:600; color:#e65100;">${formatNum(stock.now_price)}</td>
                    <td>${formatNum(stock.total_mv)}</td>
                    <td>${formatNum(stock.turnover_ratio)}</td>
                    <td>${formatNum(stock.pe)}</td>
                    <td>${formatNum(stock.pb)}</td>
                    <td>${formatNum(stock.dv_ratio)}</td>
                    <td>${formatNum(stock.roe)}</td>
                    <td>${formatNum(stock.roa)}</td>
                    <td>${formatNum(stock.revenue_growth)}</td>
                    <td>${formatNum(stock.profit_growth)}</td>
                    <td>${formatNum(stock.gross_margin)}</td>
                    <td>${formatNum(stock.net_margin)}</td>
                    <td>${formatNum(stock.debt_asset_ratio)}</td>
                    <td>${formatNum(stock.current_ratio)}</td>
                    <td>${formatNum(stock.quick_ratio)}</td>
                    <td>${formatNum(stock.bps)}</td>
                    <td>${formatNum(stock.cfps)}</td>
                `;
                tbody.appendChild(row);

                numericFields.forEach(f => baseSums[f] += floatVal(stock[f]));
            });

            const baseLen = baseData.length;

            // 👑 干净的纯年度横截面平均值行
            let avgRow = document.createElement('tr');
            avgRow.className = "avg-row";
            avgRow.innerHTML = `
                <td style="background:#f4fbfc !important;">-</td>
                <td>-</td>
                <td>📊 所选时刻横截面均值</td>
                <td>-</td>
                <td>-</td>
                <td>${formatNum(baseSums['history_price'] / baseLen)}</td>
                <td>${formatNum(baseSums['now_price'] / baseLen)}</td>
                <td>${formatNum(baseSums['total_mv'] / baseLen)}</td>
                <td>${formatNum(baseSums['turnover_ratio'] / baseLen)}</td>
                <td>${formatNum(baseSums['pe'] / baseLen)}</td>
                <td>${formatNum(baseSums['pb'] / baseLen)}</td>
                <td>${formatNum(baseSums['dv_ratio'] / baseLen)}</td>
                <td>${formatNum(baseSums['roe'] / baseLen)}</td>
                <td>${formatNum(baseSums['roa'] / baseLen)}</td>
                <td>${formatNum(baseSums['revenue_growth'] / baseLen)}</td>
                <td>${formatNum(baseSums['profit_growth'] / baseLen)}</td>
                <td>${formatNum(baseSums['gross_margin'] / baseLen)}</td>
                <td>${formatNum(baseSums['net_margin'] / baseLen)}</td>
                <td>${formatNum(baseSums['debt_asset_ratio'] / baseLen)}</td>
                <td>${formatNum(baseSums['current_ratio'] / baseLen)}</td>
                <td>${formatNum(baseSums['quick_ratio'] / baseLen)}</td>
                <td>${formatNum(baseSums['bps'] / baseLen)}</td>
                <td>${formatNum(baseSums['cfps'] / baseLen)}</td>
            `;
            tbody.appendChild(avgRow);

            document.getElementById('dataStatus').innerText = `✨ 截面运算成功：当前时刻共计有效筛选样本 ${baseLen} 组。`;
        }

        function formatNum(val) { return (val === undefined || val === null || isNaN(val) || val === '') ? '-' : parseFloat(val).toFixed(2); }
        function floatVal(val) { let f = parseFloat(val); return isNaN(f) ? 0 : f; }
        function intVal(val) { let i = parseInt(val); return isNaN(i) ? 0 : i; }

        window.onload = () => { startAppleClock(); loadData(); };
    </script>
</body>
</html>
